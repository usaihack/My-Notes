name: Auto-update README

# Runs with zero manual steps once set up:
#   - Any push that adds/edits a Day-*.md file, or a change to config.yaml,
#     triggers a rebuild.
#   - Also runs on a daily schedule as a safety net, and can be triggered
#     manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "MONTH-**"
      - "scripts/config.yaml"
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC, catches anything missed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate README
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_readme.py

      - name: Commit changes if any
        run: |
          git config user.name "readme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md scripts/.summary_cache.json
          git diff --cached --quiet || git commit -m "docs: auto-update README from latest notes [skip ci]"
          git push
