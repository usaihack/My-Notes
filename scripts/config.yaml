# -----------------------------------------------------------------------------
# Module configuration for the self-updating README.
#
# You only touch this file when a NEW MONTH starts (once every few weeks) —
# never when you just add a new Day-XX file. The workflow reads this to know
# each month's display title and roughly how many days it's expected to run,
# so it can label a month "Active" vs "Complete" vs "Planned" automatically.
#
# folder        -> must exactly match the directory name in the repo
# title         -> human-readable name shown in the README
# expected_days -> rough number of days you expect this module to take.
#                  Once actual day-files >= expected_days, it's marked Complete.
#                  Doesn't need to be exact — just a reasonable estimate.
# -----------------------------------------------------------------------------

